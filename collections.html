<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="assets/fonts/poppins-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300&display=swap" />
    <link rel="stylesheet" href="styles.css?v=26" />
    <script>
      try {
        const stored = localStorage.getItem('theme');
        if (stored === 'light' || stored === 'dark') document.documentElement.dataset.theme = stored;
        if (sessionStorage.getItem('peace-section-navigation') === 'enter-collection') {
          document.documentElement.dataset.pageTransition = 'enter-collection';
        }
      } catch (error) {}
    </script>
  </head>
  <body class="collection-page">
    <main>
      <header class="collection-header">
        <a class="collection-back" href="index.html">Back to home</a>
        <button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
          <svg class="theme-icon icon-moon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.985 12.486a9 9 0 1 1-8.472-8.472 7 7 0 0 0 8.472 8.472Z" />
          </svg>
          <svg class="theme-icon icon-sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42" />
          </svg>
        </button>
        <div class="collection-title-row">
          <span class="collection-qifrey-motion" aria-hidden="true"><img class="collection-qifrey" src="assets/illustrations/qifrey-floating.png" alt="" /></span>
          <h1 class="collection-title"></h1>
        </div>
      </header>
      <section class="collection-content" aria-live="polite"><p class="collection-loading">Loading…</p></section>
    </main>
    <dialog class="note-modal" aria-labelledby="note-modal-title">
      <button class="note-modal-close" type="button" aria-label="Close review">×</button>
      <div class="note-modal-media"></div>
      <p class="note-modal-meta"></p>
      <h2 id="note-modal-title"></h2>
      <div class="note-modal-stars" hidden></div>
      <div class="note-modal-review"></div>
    </dialog>
    <script>
      const sections = {
        projects: { title: 'My projects', selector: '.project-list' },
        tools: { title: 'My tools', selector: '.tool-list' },
        notes: { title: 'My notes', selector: '.notes-content' },
      };
      const sectionKey = new URLSearchParams(location.search).get('section');
      const section = sections[sectionKey];
      const pageTitle = document.querySelector('.collection-title');
      const content = document.querySelector('.collection-content');
      const backLink = document.querySelector('.collection-back');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const navigationKey = 'peace-section-navigation';

      backLink.addEventListener('click', (event) => {
        if (event.defaultPrevented || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button > 0 || reducedMotion.matches) return;
        event.preventDefault();
        sessionStorage.setItem(navigationKey, 'return-home');
        document.body.classList.add('is-home-leaving');
        window.setTimeout(() => window.location.assign(backLink.href), 220);
      });

      const enteringFromHome = sessionStorage.getItem(navigationKey) === 'enter-collection';
      if (enteringFromHome) sessionStorage.removeItem(navigationKey);

      const revealCollection = () => {
        if (!enteringFromHome) return;
        requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add('is-entering-collection')));
      };

      const renderCollection = (source) => {
        if (!source) throw new Error('missing collection');
        const list = source;
        list.classList.add('collection-list');
        list.hidden = false;
        list.removeAttribute('aria-hidden');
        content.replaceChildren(list);
        if (sectionKey === 'notes') loadNotes(list.querySelector('.notes-categories'));
        revealCollection();
      };

      if (!section) {
        document.title = 'Peace';
        pageTitle.textContent = 'Not found';
        content.innerHTML = '<p class="collection-error">This collection does not exist.</p>';
      } else {
        document.title = `${section.title} · Peace`;
        pageTitle.textContent = section.title;
        const cachedMarkup = sessionStorage.getItem('peace-section-markup');
        const cachedKey = sessionStorage.getItem('peace-section-markup-key');
        if (cachedMarkup && cachedKey === sectionKey) {
          const source = new DOMParser().parseFromString(cachedMarkup, 'text/html').body.firstElementChild;
          sessionStorage.removeItem('peace-section-markup');
          sessionStorage.removeItem('peace-section-markup-key');
          renderCollection(source);
        } else {
          fetch('index.html', { cache: 'no-cache' })
            .then((response) => {
              if (!response.ok) throw new Error(response.status);
              return response.text();
            })
            .then((html) => renderCollection(new DOMParser().parseFromString(html, 'text/html').querySelector(section.selector)))
            .catch(() => {
              content.innerHTML = '<p class="collection-error">This collection could not be loaded. Please return home and try again.</p>';
              revealCollection();
            });
        }
      }

      const noteModal = document.querySelector('.note-modal');
      const noteModalMedia = noteModal.querySelector('.note-modal-media');
      const noteModalMeta = noteModal.querySelector('.note-modal-meta');
      const noteModalTitle = noteModal.querySelector('#note-modal-title');
      const noteModalStars = noteModal.querySelector('.note-modal-stars');
      const noteModalReview = noteModal.querySelector('.note-modal-review');
      const closeNoteModal = noteModal.querySelector('.note-modal-close');
      const TYPE_LABELS = { movie: 'Movie', series: 'Series', game: 'Videogame', book: 'Book', manga: 'Manga', album: 'Album', thought: 'Thought', other: '' };
      const STAR_PATH = 'M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z';
      const noteMeta = (note) => [TYPE_LABELS[note.type] ?? '', note.creator].filter(Boolean).join(' · ');

      function starRow(rating) {
        const row = document.createElement('span');
        row.className = 'note-stars';
        row.setAttribute('role', 'img');
        row.setAttribute('aria-label', `${rating} out of 5 stars`);
        for (let i = 1; i <= 5; i += 1) {
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          svg.setAttribute('viewBox', '0 0 24 24');
          svg.setAttribute('class', 'star-icon');
          svg.setAttribute('aria-hidden', 'true');
          svg.setAttribute('fill', i <= rating ? 'currentColor' : 'none');
          svg.setAttribute('stroke', 'currentColor');
          svg.setAttribute('stroke-width', '1.6');
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', STAR_PATH);
          svg.appendChild(path);
          row.appendChild(svg);
        }
        return row;
      }

      function modalCard(src, alt, className) {
        const card = document.createElement('span');
        card.className = className;
        const image = document.createElement('img');
        image.src = src;
        image.alt = alt;
        card.appendChild(image);
        return card;
      }

      function renderModalMedia(note, images) {
        noteModalMedia.replaceChildren();
        noteModalMedia.hidden = !images.length;
        if (!images.length) return;
        if (images.length === 1) {
          noteModalMedia.appendChild(modalCard(images[0], `${note.title} cover`, 'note-modal-card is-single'));
          return;
        }
        const stack = document.createElement('button');
        stack.type = 'button';
        stack.className = 'note-modal-stack';
        const cards = [];
        const classes = ['note-modal-card-one', 'note-modal-card-two', 'note-modal-card-three'];
        for (let layer = Math.min(images.length, 3) - 1; layer >= 0; layer -= 1) {
          const card = modalCard('', '', `note-modal-card ${classes[layer]}`);
          cards[layer] = card;
          stack.appendChild(card);
        }
        const count = document.createElement('span');
        count.className = 'note-modal-count';
        let current = 0;
        const update = () => {
          cards.forEach((card, layer) => {
            const image = card.querySelector('img');
            image.src = images[(current + layer) % images.length];
            image.alt = layer === 0 ? `${note.title} photo ${current + 1}` : '';
          });
          count.textContent = `${current + 1} / ${images.length}`;
          stack.setAttribute('aria-label', `Photo ${current + 1} of ${images.length}. Show the next one.`);
        };
        stack.addEventListener('click', () => {
          current = (current + 1) % images.length;
          update();
          stack.classList.remove('is-turning');
          void stack.offsetWidth;
          stack.classList.add('is-turning');
        });
        update();
        noteModalMedia.append(stack, count);
      }

      function openNote(note) {
        const images = (note.images || []).filter(Boolean);
        noteModalTitle.textContent = note.title;
        noteModalMeta.textContent = noteMeta(note);
        noteModalMeta.hidden = !noteMeta(note);
        noteModalReview.replaceChildren();
        (note.review || '').split(/\n\s*\n/).forEach((chunk) => {
          if (!chunk.trim()) return;
          const paragraph = document.createElement('p');
          paragraph.textContent = chunk.trim();
          noteModalReview.appendChild(paragraph);
        });
        const rating = Number(note.rating) || 0;
        noteModalStars.replaceChildren();
        noteModalStars.hidden = rating < 1;
        if (rating) noteModalStars.appendChild(starRow(rating));
        renderModalMedia(note, images);
        noteModal.showModal();
      }

      function loadNotes(container) {
        if (!container) return;
        fetch('notes.json', { cache: 'no-cache' })
          .then((response) => {
            if (!response.ok) throw new Error(response.status);
            return response.json();
          })
          .then((data) => {
            container.replaceChildren();
            (data.categories || []).forEach((category) => {
              const categorySection = document.createElement('section');
              categorySection.className = 'notes-category';
              const heading = document.createElement('h3');
              heading.textContent = category.title;
              categorySection.appendChild(heading);
              const notes = (data.notes || []).filter((note) => note.categoryId === category.id);
              if (!notes.length) {
                const empty = document.createElement('p');
                empty.className = 'notes-empty';
                empty.textContent = category.emptyText || 'Nothing here yet.';
                categorySection.appendChild(empty);
              } else {
                const list = document.createElement('div');
                list.className = 'note-list';
                notes.forEach((note) => {
                  const item = document.createElement('article');
                  item.className = 'note-item';
                  const trigger = document.createElement('button');
                  trigger.type = 'button';
                  trigger.className = 'note-trigger';
                  trigger.textContent = note.title;
                  trigger.addEventListener('click', () => openNote(note));
                  item.appendChild(trigger);
                  const images = (note.images || []).filter(Boolean).slice(0, 3);
                  if (images.length) {
                    const preview = document.createElement('div');
                    preview.className = images.length > 1 ? 'note-preview note-preview-stack' : 'note-preview';
                    preview.setAttribute('aria-hidden', 'true');
                    const classes = ['note-card-one', 'note-card-two', 'note-card-three'];
                    images.map((src, index) => ({ src, cls: images.length > 1 ? classes[index] : 'note-card-front' })).reverse().forEach(({ src, cls }) => {
                      const card = document.createElement('div');
                      card.className = `note-card ${cls}`;
                      const image = document.createElement('img');
                      image.src = src;
                      image.alt = '';
                      image.loading = 'lazy';
                      card.appendChild(image);
                      preview.appendChild(card);
                    });
                    item.appendChild(preview);
                  }
                  list.appendChild(item);
                });
                categorySection.appendChild(list);
              }
              container.appendChild(categorySection);
            });
          })
          .catch(() => { container.innerHTML = '<p class="notes-empty">Notes could not be loaded.</p>'; });
      }

      closeNoteModal.addEventListener('click', () => noteModal.close());
      noteModal.addEventListener('click', (event) => { if (event.target === noteModal) noteModal.close(); });

      const themeToggle = document.querySelector('.theme-toggle');
      const systemDark = window.matchMedia('(prefers-color-scheme: dark)');
      const isAuto = () => !document.documentElement.dataset.theme;
      const isDark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : systemDark.matches;
      const syncToggle = () => {
        const dark = isDark();
        themeToggle.setAttribute('aria-pressed', String(dark));
        themeToggle.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
        themeToggle.title = isAuto() ? 'Following your device theme' : 'Hold to follow your device';
      };
      const setTheme = (value) => {
        if (value) document.documentElement.dataset.theme = value;
        else delete document.documentElement.dataset.theme;
        try { if (value) localStorage.setItem('theme', value); else localStorage.removeItem('theme'); } catch (error) {}
        syncToggle();
      };
      let holdTimer = null;
      let heldToAuto = false;
      const startHold = () => {
        heldToAuto = false;
        clearTimeout(holdTimer);
        holdTimer = setTimeout(() => {
          heldToAuto = true;
          setTheme(null);
          themeToggle.classList.remove('is-auto-flash');
          void themeToggle.offsetWidth;
          themeToggle.classList.add('is-auto-flash');
        }, 600);
      };
      const cancelHold = () => clearTimeout(holdTimer);
      themeToggle.addEventListener('animationend', () => themeToggle.classList.remove('is-auto-flash'));
      themeToggle.addEventListener('pointerdown', startHold);
      ['pointerup', 'pointerleave', 'pointercancel'].forEach((type) => themeToggle.addEventListener(type, cancelHold));
      themeToggle.addEventListener('keydown', (event) => { if (!event.repeat && (event.key === ' ' || event.key === 'Enter')) startHold(); });
      themeToggle.addEventListener('keyup', cancelHold);
      themeToggle.addEventListener('blur', cancelHold);
      themeToggle.addEventListener('click', () => {
        if (heldToAuto) { heldToAuto = false; return; }
        setTheme(isDark() ? 'light' : 'dark');
      });
      themeToggle.addEventListener('contextmenu', (event) => event.preventDefault());
      systemDark.addEventListener('change', () => { if (isAuto()) syncToggle(); });
      syncToggle();
    </script>
  </body>
</html>
